<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Hostscherm — Testsprong &amp; Ski Jump</title>
  <link rel="icon" href="../shared/icons/favicon.ico" />
  <link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a2c3a" />
  <link rel="stylesheet" href="../shared/style-base.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <img class="brand-mark" src="../shared/logo.png" alt="Sparkx" />
  <a class="profile-button" href="../admin/">Profiel</a>
  <div id="connection-banner" class="connection-banner hidden">
    Geen verbinding met de server – niet laten springen
  </div>
  <div id="rejected-toast" class="toast hidden"></div>

  <main id="app">
    <section id="pair-view" class="view hidden">
      <form id="pair-form" class="pair-form" autocomplete="off">
        <h1 class="pair-title">Toestel koppelen</h1>
        <p class="pair-hint">
          Dit toestel mag nog niet scannen. Vraag een beheerder om een
          koppelcode: <strong>Beheer → Systeem → Nieuwe koppelcode</strong>.
        </p>
        <label class="pair-label" for="pair-code">Koppelcode</label>
        <input id="pair-code" class="pair-code" type="text" inputmode="numeric" maxlength="6"
               placeholder="000000" required />
        <label class="pair-label" for="pair-name">Naam van dit toestel</label>
        <input id="pair-name" type="text" maxlength="40" placeholder="bv. Host 1" />
        <button type="submit" id="pair-submit" class="pair-submit">Koppelen</button>
        <p id="pair-error" class="pair-error hidden"></p>
      </form>
    </section>

    <section id="waiting-view" class="view hidden">
      <h1 class="waiting-title">Scan het bandje</h1>
      <p class="waiting-hint">Wacht op een scan…</p>
    </section>

    <section id="result-view" class="view hidden">
      <div class="wristband-id" id="wristband-id"></div>
      <div class="status-banner" id="status-banner">
        <div class="status-text" id="status-text"></div>
      </div>

      <div class="timeout-bar-track hidden" id="final-result-bar-track">
        <div class="timeout-bar" id="final-result-bar"></div>
      </div>

      <div class="actions" id="verdict-actions">
        <button id="btn-rood" class="btn btn-rood">GEFAALD</button>
        <button id="btn-groen" class="btn btn-groen">GESLAAGD</button>
      </div>

      <div class="secondary-actions" id="cancel-actions">
        <button id="btn-cancel" class="btn-text">Geen sprong / annuleer</button>
      </div>
    </section>
  </main>

  <div id="sim-panel"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
