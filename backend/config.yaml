timezone: "Europe/Brussels"
# Poort voor de telefoons en de rest van het netwerk (https).
port: 8000
# Poort voor het beheerscherm op de server-pc zelf: enkel bereikbaar via
# 127.0.0.1, dus niet vanaf het netwerk (gewone http, geen certificaat nodig).
local_port: 8001
# Map voor het https-certificaat. Wordt bij de eerste start automatisch
# aangemaakt; laat deze map staan, anders moet elke telefoon de server
# opnieuw vertrouwen (zie de handleiding).
tls_dir: "../data/tls"
# De server weigert elk verzoek vanaf een internetadres: enkel toestellen op
# het eigen netwerk (10.x, 172.16-31.x, 192.168.x, ...) mogen hem bereiken.
# Gebruikt het parknetwerk toch "internetadressen" intern, zet die
# netwerken hier, bv. ["203.0.113.0/24"]. Normaal leeg laten.
extra_allowed_networks: []
# Hoeveel seconden een oefensprong op bevestiging mag wachten voor die vervalt.
# (Een scan die op een oordeel wacht, de 1e/2e poging, vervalt nooit.)
scan_timeout_seconds: 60
# Hoeveel seconden inactiviteit voor een beheerdersessie automatisch uitlogt.
session_inactivity_timeout_seconds: 120
# Hoeveel dagen logs bewaard blijven voor de opruimfunctie ze verwijdert.
log_retention_days: 365
# Hoe vaak (uren) de server automatisch oude logs opruimt en een back-up
# van de database maakt. Draait ook meteen één keer bij het opstarten.
maintenance_interval_hours: 24
# Map waarin de automatische back-ups terechtkomen (relatief t.o.v. backend/).
backup_dir: "../data/backups"
# Hoeveel dagen automatische back-ups bewaard blijven voor ze opgeruimd worden.
backup_retention_days: 30
# Hoe vaak (seconden) de schermen de serververbinding en status pollen.
polling_interval_seconds: 3
# Uitbreidingspunt "kussen vrij"-sensor (buiten scope): nu altijd uit.
cushion_sensor_enabled: false
gate_controller: "dummy"
database_path: "../data/toelating.db"
